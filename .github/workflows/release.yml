name: Mikasa Gallery | Tagged Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mikasa-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build Tagged APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-37.0'

      - name: Verify Android SDK
        run: |
          sdkmanager --version
          test -d "$ANDROID_HOME/platforms/android-37.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Collect Release APKs
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          COUNT=0

          while IFS= read -r -d '' APK; do
            cp "$APK" "dist/$(basename "$APK")"
            COUNT=$((COUNT + 1))
          done < <(
            find app/build/outputs/apk/release \
              -type f -name '*.apk' -print0
          )

          [[ "$COUNT" -gt 0 ]] || {
            echo "Release APK missing."
            exit 1
          }

          sha256sum dist/*.apk

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: dist/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
