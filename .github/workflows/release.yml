name: Mikasa Gallery | Tagged Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mikasa-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build Tagged Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-37.0'

      - name: Verify Android SDK
        run: |
          sdkmanager --version
          test -d "$ANDROID_HOME/platforms/android-37.0"

      - name: Setup Trusted Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'
          validate-wrappers: false
          cache-provider: basic

      - name: Build Release APK
        run: |
          gradle --no-daemon --stacktrace assembleRelease

      - name: Collect Release APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          COUNT=0

          if [[ -d app/build/outputs/apk/release ]]; then
            while IFS= read -r -d '' APK; do
              cp "$APK" "dist/$(basename "$APK")"
              COUNT=$((COUNT + 1))
            done < <(
              find app/build/outputs/apk/release \
                -type f -name '*.apk' -print0
            )
          fi

          [[ "$COUNT" -gt 0 ]] || {
            echo "Release APK not generated."
            exit 1
          }

          sha256sum dist/*.apk
          ls -lh dist/

      - name: Publish Tagged Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: dist/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: true
