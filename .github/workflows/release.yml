name: Release APK on Tag

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release Tagged APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Extract Version from Tag
        id: version
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          VERSION_NAME=${TAG_NAME#v}
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION_NAME" >> $GITHUB_OUTPUT

      - name: Build Signed Release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Rename APK for Release
        run: |
          REL_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          cp "$REL_APK" "Mikasa-Gallery-${{ steps.version.outputs.tag }}-AMOLED-Yellow.apk"

      - name: Upload Release APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: Mikasa-Gallery-${{ steps.version.outputs.tag }}-AMOLED-Yellow.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
