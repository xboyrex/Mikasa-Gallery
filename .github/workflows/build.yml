name: Mikasa Gallery | Android CI & Auto Release

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mikasa-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Mikasa Gallery APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-37.0'

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --version
          test -d "$ANDROID_HOME/platforms/android-37.0"
          echo "Android API 37.0 verified."

      # Install trusted Gradle distribution directly.
      # The repository's unverified wrapper JAR is never executed.
      - name: Setup Trusted Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'
          validate-wrappers: false
          cache-provider: basic

      - name: Verify Build Environment
        run: |
          set -euo pipefail
          java -version
          gradle --version
          command -v gradle

      - name: Build Debug and Release APKs
        run: |
          gradle \
            --no-daemon \
            --stacktrace \
            assembleDebug assembleRelease

      - name: Collect APK Artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          COUNT=0

          for VARIANT in release debug; do
            DIR="app/build/outputs/apk/$VARIANT"
            [[ -d "$DIR" ]] || continue

            while IFS= read -r -d '' APK; do
              cp "$APK" "dist/${VARIANT}-$(basename "$APK")"
              COUNT=$((COUNT + 1))
            done < <(find "$DIR" -type f -name '*.apk' -print0)
          done

          [[ "$COUNT" -gt 0 ]] || {
            echo "No APK artifacts found."
            exit 1
          }

          sha256sum dist/*.apk
          ls -lh dist/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Mikasa-Gallery-APKs-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: "Mikasa Gallery v1.0.${{ github.run_number }} — AMOLED Yellow Edition"
          body: |
            ## Mikasa Gallery

            - Pure AMOLED Pitch Black (#000000)
            - Onyx Yellow (#FFD600)
            - YTX Liquid Glass Navigation
            - Automated Android APK builds
          files: dist/*.apk
          generate_release_notes: true
          overwrite_files: true
