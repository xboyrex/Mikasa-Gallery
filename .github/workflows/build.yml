name: Mikasa Gallery | Android CI & Auto Release

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mikasa-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Mikasa Gallery
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # v4: no obsolete Google SDK "tools" package
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-37'

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --version
          test -d "$ANDROID_HOME/platforms/android-37"
          echo "Android API 37 available."

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Java and Gradle
        run: |
          chmod +x gradlew
          java -version
          ./gradlew --version

      - name: Build Debug and Release
        run: |
          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug assembleRelease

      - name: Collect APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          COUNT=0

          for VARIANT in release debug; do
            DIR="app/build/outputs/apk/$VARIANT"

            if [[ -d "$DIR" ]]; then
              while IFS= read -r -d '' APK; do
                cp "$APK" "dist/${VARIANT}-$(basename "$APK")"
                COUNT=$((COUNT + 1))
              done < <(find "$DIR" -type f -name '*.apk' -print0)
            fi
          done

          if [[ "$COUNT" -eq 0 ]]; then
            echo "No APK files generated."
            exit 1
          fi

          sha256sum dist/*.apk
          ls -lh dist/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Mikasa-Gallery-APKs-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: "Mikasa Gallery v1.0.${{ github.run_number }} — AMOLED Yellow Edition"
          body: |
            ## Mikasa Gallery

            - AMOLED Pitch Black (#000000)
            - Onyx Yellow (#FFD600)
            - YTX Liquid Glass Navigation
            - Automated Android APK build
          files: dist/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
